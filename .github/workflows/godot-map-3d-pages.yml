name: Deploy Godot 3D PoC to Pages

on:
  push:
    branches: [main]
    paths:
      - "poc/godot-map-3d/**"
      - ".github/workflows/godot-map-3d-pages.yml"
  pull_request:
    paths:
      - "poc/godot-map-3d/**"
      - ".github/workflows/godot-map-3d-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender for model conversion
        run: sudo apt-get update && sudo apt-get install -y blender python3-numpy

      - name: Convert CC0 source models to GLB
        run: bash poc/godot-map-3d/prepare_models.sh

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Run scene and require map generation
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          timeout 15s godot --headless --path poc/godot-map-3d 2>&1 | tee "$log_file" || status=$?
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Cannot get class" "$log_file"; then
            echo "Godot reported a script loading error."
            exit 1
          fi
          if ! grep -q "MAP_BUILD_SUCCESS" "$log_file"; then
            echo "The running scene did not finish JSON to 3D generation."
            exit 1
          fi

      - name: Export Web build
        run: |
          mkdir -p poc/godot-map-3d/build/web
          timeout 5m godot --headless --path poc/godot-map-3d --export-release Web build/web/index.html

      - name: Install browser test dependencies
        working-directory: poc/godot-map-3d
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Smoke-test map and mobile movement
        working-directory: poc/godot-map-3d
        run: node web_smoke_test.mjs

      - name: Upload Web smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-smoke
          path: poc/godot-map-3d/build/web-smoke.png
          if-no-files-found: ignore

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender for model conversion
        run: sudo apt-get update && sudo apt-get install -y blender python3-numpy

      - name: Convert CC0 source models to GLB
        run: bash poc/godot-map-3d/prepare_models.sh

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Export versioned Web build
        shell: bash
        run: |
          release_dir="poc/godot-map-3d/build/web/releases/${GITHUB_SHA}"
          mkdir -p "$release_dir"
          timeout 5m godot --headless --path poc/godot-map-3d --export-release Web "build/web/releases/${GITHUB_SHA}/index.html"
          printf '%s\n' '<!doctype html>' '<meta charset="utf-8">' '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">' '<meta http-equiv="Pragma" content="no-cache">' '<meta http-equiv="Expires" content="0">' "<meta http-equiv=\"refresh\" content=\"0; url=releases/${GITHUB_SHA}/\">" "<script>location.replace('releases/${GITHUB_SHA}/'+location.search+location.hash)</script>" > poc/godot-map-3d/build/web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload existing site plus PoC
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}poc/godot-map-3d/build/web/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
