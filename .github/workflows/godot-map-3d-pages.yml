name: Deploy Godot 3D PoC to Pages

on:
  push:
    branches: [main]
    paths:
      - "poc/godot-map-3d/**"
      - ".github/workflows/godot-map-3d-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Export Web build
        run: |
          mkdir -p poc/godot-map-3d/build/web
          godot --headless --path poc/godot-map-3d --export-release Web build/web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload existing site plus PoC
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}poc/godot-map-3d/build/web/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
